<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoCycle | Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/logo.svg" alt="EcoCycle logo">
      <span>EcoCycle</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="types.html">Recycling Types</a>
      <a href="calculator.html">Calculator</a>
      <a href="quiz.html">Quiz</a>
      <a href="contact.html" class="active">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p class="intro">Have a question or an idea? Send us a message.</p>

    <form id="contactForm" class="form-box" onsubmit="validateForm(event)">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your name">
      <p id="nameError" class="error"></p>

      <label for="email">Email</label>
      <input type="text" id="email" placeholder="example@email.com">
      <p id="emailError" class="error"></p>

      <label for="phone">Phone (optional)</label>
      <input type="text" id="phone" placeholder="05XXXXXXXX">
      <p id="phoneError" class="error"></p>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message (at least 10 characters)"></textarea>
      <p id="messageError" class="error"></p>

      <button type="submit">Send</button>
      <div id="success" class="result"></div>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 EcoCycle – Web Programming Project, University of Sharjah</p>
  </footer>

  <script src="js/contact.js"></script>
</body>
</html>
